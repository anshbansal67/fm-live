# Fine Margins Edges: the record's must-never-stop steps, every 30 min (LAPTOP_PROOF.md; coordinator 12:30). Lives in fm-live (public repo:
# unlimited Actions minutes). Built by lane 2; pushed 15 Nov on Ansh's yes, in shadow mode (publishes nothing) until the switch-over.
# Secrets (Ansh pastes them: fm-live -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   ODDSPAPI_KEY, ODDSAPI_KEY                      required
#   TELEGRAM_TOKEN, TELEGRAM_CHAT, PRO_ALERT_SECRET only when alerts are switched on (repository variables TG_LIVE=1 / PRO_LIVE=1)
# State (snapshots, picks, caches) is kept in the Actions cache, which is private to this repo's workflows: nothing unpublished becomes public.
name: Edges record
on:
  schedule: [ { cron: '7,37 * * * *' } ]
  workflow_dispatch: {}
concurrency: { group: edges-state, cancel-in-progress: false }
permissions: { contents: write }
env:
  SHADOW: ${{ vars.EDGES_SHADOW || '1' }}          # 1 = build and score, publish nothing (23-29 Nov); set the repo variable to 0 on switch-over
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the keys (Ansh pastes them as repository secrets)
        id: keys
        env: { K: '${{ secrets.ODDSPAPI_KEY }}' }
        run: if [ -n "$K" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ODDSPAPI_KEY not set yet; this run does nothing"; fi
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == '1'
        with: { python-version: '3.12' }
      - if: steps.keys.outputs.ok == '1'
        run: pip install -q pandas numpy pyarrow
      - name: Restore state
        if: steps.keys.outputs.ok == '1'
        uses: actions/cache/restore@v4
        with:
          path: work/output
          key: edges-state-${{ github.run_id }}
          restore-keys: edges-state-
      - name: Lay out the work folder (same shape as cricket-project/t20)
        if: steps.keys.outputs.ok == '1'
        run: |
          mkdir -p work/scratch/edge work/output/markets/live work/output/markets/odds/oa work/secrets
          cp edges/*.py work/scratch/edge/
          if [ ! -f work/output/markets/live/early_picks.jsonl ] && [ -f edges_seed/early_picks.jsonl ]; then cp edges_seed/early_picks.jsonl work/output/markets/live/; echo "seeded the pick history from edges_seed/"; fi
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S')Z] snapshot: cloud run ${{ github.run_id }}" >> work/output/markets/live/actions.log
      - name: Prices and picks
        if: steps.keys.outputs.ok == '1'
        env:
          FM_T: '${{ github.workspace }}/work'
          FM_ACTIONS: '1'
          EP_MIN_GAP_MIN: '55'
          ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'
          ODDSAPI_KEY: '${{ secrets.ODDSAPI_KEY }}'
        run: |
          cd work
          python scratch/edge/early_picks.py 2>&1 | tail -2 | sed "s/^/[$(date -u '+%Y-%m-%d %H:%M:%S')Z] early picks: /" | tee -a output/markets/live/actions.log
          if [ "$SHADOW" != "1" ]; then python scratch/edge/oa_collect.py 2>&1 | tail -2 || true; fi   # the Mac takes the-odds-api snapshots during shadow: no double spend of the 500 credits
          python scratch/edge/oa_picks.py 2>&1 | tail -2 || true
      - name: Score, board, feeds, alerts, health
        if: steps.keys.outputs.ok == '1'
        env:
          FM_T: '${{ github.workspace }}/work'
          FM_ACTIONS: '1'
          FM_LIVE_DIR: '${{ github.workspace }}'
          ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'
          TELEGRAM_TOKEN: '${{ secrets.TELEGRAM_TOKEN }}'
          TELEGRAM_CHAT: '${{ secrets.TELEGRAM_CHAT }}'
          TG_LIVE: '${{ vars.TG_LIVE }}'
          PRO_ALERT_SECRET: '${{ secrets.PRO_ALERT_SECRET }}'
        run: |
          cd work
          git -C .. config user.name edges-bot; git -C .. config user.email edges-bot@users.noreply.github.com
          python scratch/edge/edges_health.py | tail -1 || true      # before publishing, so this run's health goes out with the picks
          if [ "$SHADOW" = "1" ]; then python scratch/edge/early_eval.py | tail -3; else python scratch/edge/early_eval.py --publish 2>&1 | tail -3 | sed "s/^/[$(date -u '+%Y-%m-%d %H:%M:%S')Z] picks feed: /" | tee -a output/markets/live/actions.log; fi
          python scratch/edge/value_board.py | tail -1 || true
          python scratch/edge/edges_feed.py | tail -1 || true
          if [ "$SHADOW" != "1" ]; then python scratch/edge/tg_alerts.py | tail -1 || true; fi
          if [ "$SHADOW" != "1" ] && [ "${{ vars.PRO_LIVE }}" = "1" ]; then python scratch/edge/pro_alerts.py | tail -1 || true; fi
      - name: Save state
        if: always() && steps.keys.outputs.ok == '1'
        uses: actions/cache/save@v4
        with:
          path: work/output
          key: edges-state-${{ github.run_id }}
