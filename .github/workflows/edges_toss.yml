# 15 Nov 22:1x (coordinator 22:00): the record and toss runs now start each other (record -> toss -> record ...), each waiting for its
# own slot; the cron stays as a back-up that restarts the chain if it ever breaks. One concurrency group, so only one chain exists.
# Fine Margins Edges: toss-window poll (arm BT). Every 30 min it checks for a fixture starting within 40 min; if there is one it stays up and
# polls every 3 min until the start (early_picks.py --toss), then saves state. Same secrets and state as edges.yml.
name: Edges toss window
on:
  schedule: [ { cron: '22,52 * * * *' } ]
  workflow_dispatch:
    inputs: { chained: { description: 'started by the previous run (waits for its slot)', required: false, default: '0' } }
concurrency: { group: edges-state, cancel-in-progress: false }
permissions: { contents: read, actions: write }   # actions: write lets a run start the next one (the chain)
jobs:
  toss:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for this run's slot (a chained run starts early and waits; scheduled or manual runs go now)
        if: github.event_name == 'workflow_dispatch' && inputs.chained == '1'
        run: |
          python3 - <<'PY'
          import time, datetime as dt
          slots = [int(x) for x in "22,52".split(',')]
          now = dt.datetime.now(dt.timezone.utc); m = now.minute + now.second / 60
          nxt = min((s for s in slots if s >= m), default=slots[0] + 60)
          wait = max(0, (nxt - m) * 60); print(f"waiting {wait/60:.1f} min for the :{nxt % 60:02d} slot", flush=True); time.sleep(min(wait, 31 * 60))
          PY
      - uses: actions/checkout@v4
      - name: Wait for the keys (Ansh pastes them as repository secrets)
        id: keys
        env: { K: '${{ secrets.ODDSPAPI_KEY }}' }
        run: if [ -n "$K" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ODDSPAPI_KEY not set yet; this run does nothing"; fi
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == '1'
        with: { python-version: '3.12' }
      - if: steps.keys.outputs.ok == '1'
        run: pip install -q pandas numpy pyarrow
      - if: steps.keys.outputs.ok == '1'
        uses: actions/cache/restore@v4
        with:
          path: work/output
          key: edges-state-${{ github.run_id }}
          restore-keys: edges-state-
      - if: steps.keys.outputs.ok == '1'
        run: mkdir -p work/scratch/edge && cp edges/*.py work/scratch/edge/ && cp -r fm_edges work/fm_edges
      - name: Poll if a match starts within 40 min
        if: steps.keys.outputs.ok == '1'
        env:
          FM_T: '${{ github.workspace }}/work'
          FM_ACTIONS: '1'
          ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'
          SHADOW: ${{ vars.EDGES_SHADOW || '1' }}
          EDGES_COMMIT_REVEAL: '${{ vars.EDGES_COMMIT_REVEAL }}'
          EDGES_KILL: '${{ vars.EDGES_KILL }}'   # 1 = stop every alert and every publish at once (kill switch)
          TELEGRAM_TOKEN: '${{ secrets.TELEGRAM_TOKEN }}'
          TELEGRAM_CHAT: '${{ secrets.TELEGRAM_CHAT }}'
          TG_LIVE: '${{ vars.TG_LIVE }}'
          PRO_LIVE: '${{ vars.PRO_LIVE }}'
          PRO_ALERT_SECRET: '${{ secrets.PRO_ALERT_SECRET }}'
        run: cd work && python scratch/edge/early_picks.py --toss | tail -6   # 15 Nov: a toss pick's alerts go out from inside the poll (not shadow)
      - if: always() && steps.keys.outputs.ok == '1'
        uses: actions/cache/save@v4
        with:
          path: work/output
          key: edges-state-${{ github.run_id }}
      - name: "Chain the next run (coordinator 22:00; GitHub's cron stays as a back-up)"
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh workflow run edges.yml --repo "$GITHUB_REPOSITORY" --ref main -f chained=1 && echo "next run started: edges.yml" || echo "chain dispatch failed (the cron back-up restarts it)"
